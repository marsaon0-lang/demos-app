<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>DEMOS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DEMOS">
<meta name="theme-color" content="#11151F">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>/* DEMOS Mini App v0 — токены из Figma (страница «Дизайн-система») */
:root{
  --bg-app:#11151F; --bg-surface:#181E2E; --bg-raised:#222B45; --bg-raised-hover:#2D3858;
  --bg-accent:#0166FF; --bg-accent-soft:rgba(1,102,255,.16);
  --bg-success-soft:rgba(43,196,138,.16); --bg-warning-soft:rgba(245,165,36,.16); --bg-danger-soft:rgba(240,82,79,.16);
  --t-primary:#FFFFFF; --t-secondary:#9AA3B8; --t-muted:#646D84; --t-accent:#3D8BFF;
  --t-success:#2BC48A; --t-warning:#F5A524; --t-danger:#F0524F;
  --b-default:rgba(255,255,255,.10); --b-strong:rgba(255,255,255,.60); --b-accent:#0166FF;
  --header-h:52px; --nav-h:72px; --actions-h:118px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0B0E15;color:var(--t-primary);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#app{position:relative;max-width:430px;height:100%;margin:0 auto;background:var(--bg-app);overflow:hidden}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;padding:16px}
  #app{height:100%;max-height:900px;border-radius:28px;box-shadow:0 0 0 1px var(--b-default),0 30px 80px rgba(0,0,0,.6);width:390px}
}
/* типографика */
.title{font-weight:700;font-size:24px;line-height:1.25}
.heading{font-weight:600;font-size:18px;line-height:1.35}
.body{font-size:15px;line-height:1.45}
.strong{font-weight:600;font-size:15px;line-height:1.4}
.caption{font-size:13px;line-height:1.4}
.micro{font-weight:600;font-size:11px;line-height:1.3;letter-spacing:.02em}
.wordmark{font-family:"Unbounded","Open Sans",sans-serif;font-weight:900;font-size:20px;letter-spacing:.02em}
.c-sec{color:var(--t-secondary)} .c-mut{color:var(--t-muted)} .c-acc{color:var(--t-accent)} .c-suc{color:var(--t-success)} .c-warn{color:var(--t-warning)} .c-dan{color:var(--t-danger)}
/* экраны */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-app);padding-top:var(--safe-top)}
.screen.anim-in{animation:slideIn .22s ease-out}
@keyframes slideIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:0 20px}
.topbar{display:flex;align-items:center;gap:4px;height:52px;padding:0 12px 0 4px;flex-shrink:0}
.topbar .back{width:44px;height:44px;display:grid;place-items:center}
.topbar .back svg{width:10px;height:18px}
.topbar .ttl{flex:1;font-weight:600;font-size:18px}
.topbar .step{color:var(--t-muted);font-size:13px}
/* шапка приложения */
.app-header{height:var(--header-h);display:flex;align-items:center;gap:18px;padding:0 16px;flex-shrink:0}
.tabs{display:flex;gap:4px}
.tab{padding:4px 8px;border-radius:8px;font-weight:600;font-size:15px;color:var(--t-muted)}
.tab.on{color:var(--t-primary)}
/* нижнее меню */
.bottom-nav{height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--b-default);background:var(--bg-app);flex-shrink:0}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--t-muted);font-size:11px;font-weight:600}
.nav-item.on{color:var(--t-primary)}
.nav-item svg{width:24px;height:24px}
.nav-item svg.create-btn{width:60px;height:53px;position:relative;filter:drop-shadow(0 0 12px rgba(1,102,255,.55))}
/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;font-weight:600;font-size:16px;width:100%;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--bg-accent);color:#fff}
.btn.secondary{background:var(--bg-raised);color:var(--t-primary)}
.btn.ghost{color:var(--t-accent)}
.btn.danger{background:var(--bg-danger-soft);color:var(--t-danger)}
.btn.x3d{background:linear-gradient(135deg,#0166FF,#3DB4FF);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .cnt{opacity:.7;font-weight:600;font-size:14px}
/* чипы-теги */
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:rgba(17,21,31,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid transparent;white-space:nowrap;font-size:13px;font-weight:600;flex-shrink:0}
.chip .n{color:var(--t-secondary);font-weight:400}
.chip.sub{border-color:#fff}
.chip .vdot{width:5px;height:5px;border-radius:50%;background:var(--t-secondary)}
.chip.solid{background:var(--bg-raised);backdrop-filter:none}
.chip.all{background:var(--bg-accent-soft);border-color:var(--b-accent);color:var(--t-accent);font-weight:700}
/* лента */
.feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column}
.media{position:relative;flex:1;overflow:hidden;background:#000}
.media .slide{position:absolute;inset:0;background-size:cover;background-position:center}
.media .shade-top{position:absolute;left:0;right:0;top:0;height:190px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.media .shade-bot{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}
.bars{position:absolute;top:8px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.bars i.seen{background:rgba(255,255,255,.95)}
.bars i.cur{background:#fff}
.bars i.unread{background:linear-gradient(90deg,#3D8BFF,#3DB4FF)}
.tap-prev,.tap-next{position:absolute;top:0;bottom:0;z-index:2}
.tap-prev{left:0;width:35%} .tap-next{right:0;width:65%}
.tags-strip{position:absolute;top:19px;left:0;right:0;height:36px;display:flex;align-items:center;gap:6px;padding:3px 104px 3px 16px;overflow-x:auto;z-index:4;scrollbar-width:none}
.tags-strip::-webkit-scrollbar{display:none}
.tags-fade{position:absolute;top:19px;right:0;width:64px;height:36px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.7) 45%);z-index:5;pointer-events:none}
.add-tag{position:absolute;top:22px;right:16px;width:30px;height:30px;border-radius:50%;background:rgba(17,21,31,.6);border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:20px;font-weight:600;z-index:6}
.author{position:absolute;top:66px;left:16px;right:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;row-gap:8px;align-items:start;z-index:4}
.author .who{grid-column:1;grid-row:1;min-width:0}
.author .more{grid-column:2;grid-row:1}
.author .sub-btn{grid-column:1 / -1;grid-row:2;justify-self:end}
.author .nick{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.author .meta{font-size:12px;color:rgba(255,255,255,.75)}
.sub-btn{height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:13px;font-weight:600;white-space:nowrap}
.sub-btn.on{background:transparent;border:1.5px solid #fff}
.more{width:32px;height:32px;display:grid;place-items:center;font-size:20px;border-radius:50%}
.overlay{position:absolute;left:16px;right:72px;bottom:16px;z-index:4}
.overlay .txt{font-size:15px;line-height:1.4;text-shadow:0 1px 2px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.overlay .txt.full{-webkit-line-clamp:unset;max-height:40vh;overflow:auto}
.overlay .more-link{color:rgba(255,255,255,.7);font-weight:600}
.rail{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:16px;align-items:center;z-index:4}
.rail button,.rail div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600}
.rail svg{width:26px;height:26px}
.strength{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;font-weight:600}
.strength .sig{display:flex;align-items:flex-end;gap:2px;height:14px}
.strength .sig i{width:3px;border-radius:1px;background:rgba(255,255,255,.3)}
.strength .sig i.on{background:#fff}
.strength .up{color:var(--t-success)} .strength .down{color:var(--t-muted)}
/* блок действий */
.actions{padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px;background:var(--bg-app);flex-shrink:0}
.actions .row{display:flex;gap:10px}
.mt{display:flex;align-items:center;gap:10px}
.mt .lbl{font-size:12px;color:var(--t-muted);font-weight:600}
.mt .val{font-size:13px;font-weight:600}
.mt .bar{flex:1;height:4px;border-radius:2px;background:var(--bg-raised);overflow:hidden}
.mt .bar i{display:block;height:100%;background:var(--t-accent)}
.mt .of{font-size:12px;color:var(--t-secondary);white-space:nowrap}
.info-i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--t-muted);color:var(--t-muted);font-size:11px;font-weight:700;display:grid;place-items:center}
.part{background:var(--bg-surface);border:1px solid var(--b-default);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.part .top{display:flex;justify-content:space-between;align-items:center}
.prog{height:6px;border-radius:3px;background:var(--bg-raised);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#0166FF,#3DB4FF)}
/* листы (bottom sheets) */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:50;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--bg-surface);border-radius:20px 20px 0 0;z-index:51;display:flex;flex-direction:column;animation:up .22s ease-out;padding-bottom:calc(16px + var(--safe-bottom))}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--b-strong);opacity:.4;margin:12px auto 8px;flex-shrink:0}
.sheet .sc{overflow-y:auto;padding:0 20px}
.sheet .foot{padding:12px 20px 0;display:flex;flex-direction:column;gap:8px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--b-default);font-size:15px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--t-secondary)}
.kv .v{font-weight:600}
.box{background:var(--bg-raised);border-radius:14px;padding:12px 14px}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amt{height:44px;border-radius:12px;background:var(--bg-raised);font-weight:600;border:1.5px solid transparent}
.amt.on{border-color:var(--b-accent);background:var(--bg-accent-soft);color:var(--t-accent)}
.check{display:flex;gap:10px;align-items:center;width:100%;min-height:44px;padding:4px 0;text-align:left;font-size:13px;line-height:1.35;color:var(--t-secondary);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.check *{pointer-events:none}
.fine{font-size:11px;line-height:1.4}
.check .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--t-muted);flex-shrink:0;display:grid;place-items:center}
.check.on .bx{background:var(--bg-accent);border-color:var(--bg-accent)}
.check.on .bx::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.icon-circle{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:8px auto 12px;font-size:28px;font-weight:700}
.center{text-align:center}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--b-default)}
.thumb{width:56px;height:72px;border-radius:10px;background-size:cover;background-position:center;flex-shrink:0}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600}
.badge.acc{background:var(--bg-accent-soft);color:var(--t-accent)}
.badge.suc{background:var(--bg-success-soft);color:var(--t-success)}
.badge.mut{background:var(--bg-raised);color:var(--t-secondary)}
.badge.warn{background:var(--bg-warning-soft);color:var(--t-warning)}
.field{background:var(--bg-raised);border:1px solid var(--b-default);border-radius:14px;padding:12px 14px}
.field textarea{width:100%;background:none;border:0;outline:0;resize:none;min-height:110px;font-size:15px;line-height:1.45}
.field input{width:100%;background:none;border:0;outline:0;font-size:15px}
.seg{display:flex;background:var(--bg-surface);border-radius:12px;padding:3px}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:600;color:var(--t-secondary);font-size:14px}
.seg button.on{background:var(--bg-raised);color:var(--t-primary)}
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--nav-h) + 16px + var(--safe-bottom));background:var(--bg-raised);border:1px solid var(--b-default);border-radius:14px;padding:12px 14px;font-size:14px;z-index:80;animation:up .2s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.empty{padding:40px 20px;text-align:center;color:var(--t-secondary)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--bg-raised-hover)} .dots i.on{background:#fff;width:18px;border-radius:3px}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tag-grid .chip{background:var(--bg-surface);backdrop-filter:none;height:34px}
.tag-grid .chip.sub{border-color:#fff}
.comment{display:flex;flex-direction:column;gap:4px;padding:10px 0}
.comment.reply{margin-left:28px;padding-left:12px;border-left:2px solid var(--b-default)}
.map{position:relative;flex:1;background:
  linear-gradient(0deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/40px 40px,
  radial-gradient(circle at 30% 40%,#1d2a44,#121827 70%)}
.map .road{position:absolute;background:rgba(255,255,255,.08)}
.pin{position:absolute;left:50%;top:42%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(1,102,255,.14);border:1px solid rgba(1,102,255,.4);display:grid;place-items:center}
.pin i{width:22px;height:22px;border-radius:50%;background:var(--bg-accent);border:3px solid #fff;box-shadow:0 0 0 6px rgba(1,102,255,.25)}
.logo-tri{width:124px;height:110px}
.hidden{display:none!important}
/* карта (Leaflet, минимальные стили) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;touch-action:none;outline:0}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-pane>svg path{pointer-events:none}
.leaflet-control-container{display:none}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.5)}
.map.live{background:#1a2133}
.map.live .road{display:none}
.map .pin{top:50%;z-index:900;pointer-events:none}
.map-attr{position:absolute;right:6px;bottom:26px;z-index:900;font-size:10px;color:var(--t-muted);pointer-events:none}

.media video.slide{width:100%;height:100%;object-fit:cover}
.thumb{overflow:hidden;padding:0}

/* X3D как NFT */
.nft-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nft{display:flex;flex-direction:column;gap:6px;padding:6px 6px 10px;border-radius:16px;background:var(--bg-raised);border:2px solid transparent;text-align:center;transition:transform .1s}
.nft:active{transform:scale(.97)}
.nft.on{border-color:var(--b-accent);background:var(--bg-accent-soft)}
.nft-art{position:relative;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;overflow:hidden;max-width:100%}
.nft-art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 55%)}
.nft-tri{width:46%;height:auto;position:relative;z-index:1}
.nft-badge{position:absolute;top:6px;left:6px;z-index:2;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.35)}
.nft-x{position:absolute;bottom:6px;right:8px;z-index:2;font-family:"Unbounded","Open Sans",sans-serif;font-weight:900;font-size:11px}
.nft-ton{font-weight:700;font-size:15px}
.nft-dm{font-size:11px;color:var(--t-secondary)}

.lot{background:var(--bg-surface);border:1px solid var(--b-default);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.lot .top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.nft-img{display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:100%}
.nft-img img{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}

.mt .share{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:12px;white-space:nowrap}
.mt .share b{font-weight:700}
.mt .share .of{color:var(--t-secondary)}
.mt-tri{flex-shrink:0;display:block}

.tipbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--bg-raised)}
.tipbox .top{display:flex;justify-content:space-between;align-items:center}
.amt.tipb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:50px;line-height:1.2}
.amt.tipb small{font-size:11px;color:var(--t-secondary);font-weight:400}
.amt.rec{border-color:var(--b-accent)}
.tipbox .amt{background:var(--bg-surface)}
.mt-mini{display:flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.mt-mini b{font-weight:700}
.actions .row .btn{height:42px} /* Раздать и X3D · Буст — ниже (23.10) */
.nick{color:var(--t-primary);font-weight:700}
.install-banner{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:10px 12px;border-radius:14px;background:var(--bg-surface);border:1px solid var(--b-default);flex-shrink:0}
.app-icon{width:96px;height:96px;border-radius:22px;background:#11151F;border:1px solid var(--b-strong);display:grid;place-items:center;padding-top:4px}
.app-icon .logo-tri{width:54px;height:auto}
</style></head>

// вывод (решено 23.10): каждая покупка — через 14 дней после покупки, комиссия 6%
const LOCK_DAYS = 14, FEE = 6;
const daysHeld = l => Math.floor((Date.now()-l.at)/86400000);
const daysLeft = l => Math.max(0, LOCK_DAYS - daysHeld(l));
const canOut = l => daysHeld(l) >= LOCK_DAYS;
const balance = () => S.lots.reduce((a,l)=>a+l.demos,0);
// награда автору: % от покупки, который зритель оставляет автору; передаётся при выводе или когда Тропа завершится
// порядок (решено 23.10): сначала комиссия сервиса 6% (в ней и реферальный 1%), награда автору — % от остатка
const afterFee = demos => Math.round(demos*(1-FEE/100));
const tipOf = (demos, tip) => Math.round(afterFee(demos)*(tip||0)/100);
const lotTip = l => tipOf(l.demos, l.tip);
const lotOut = l => afterFee(l.demos) - lotTip(l);
const readyLots = () => S.lots.filter(canOut);
const netOut = () => readyLots().reduce((a,l)=>a+lotOut(l),0);
const tipsTotal = () => readyLots().reduce((a,l)=>a+lotTip(l),0);
const readyBal = () => readyLots().reduce((a,l)=>a+l.demos,0);
const TIP_OPTS = [1,5,20];
function tipChooser(base, sel, custom){
  return `<div class="amounts">${TIP_OPTS.map(v=>`<button class="amt tipb ${sel===v?'on':''}" data-a="tip-pick" data-v="${v}"><span>${v}%</span><small>${fmt(base*v/100)}</small></button>`).join('')}<button class="amt tipb ${sel==='custom'?'on':''}" data-a="tip-pick" data-v="custom"><span>Своя</span><small>${sel==='custom'&&+custom?fmt(base*custom/100):'%'}</small></button></div>
   ${sel==='custom'?`<div class="field" style="display:flex;gap:8px;align-items:center"><input id="tip-custom" type="text" inputmode="numeric" maxlength="3" placeholder="Свой процент, от 1 до 100" value="${esc(custom||'')}" data-input="tip-custom"><span class="c-sec">%</span></div>`:''}
   <div class="caption c-acc">5% — рекомендуемая награда</div>`;
}
const tipValue = p => p.tip==='custom' ? Math.min(100, Math.max(0, +p.tipCustom||0)) : (p.tip||0);
const dayWord = n => (n%10===1&&n%100!==11)?'день':(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?'дня':'дней';
function lotHTML(l){ const d = daysHeld(l), left = daysLeft(l), ok = canOut(l), out = lotOut(l);
  const pct = Math.min(100, Math.round(100*d/LOCK_DAYS));
  return `<div class="lot"><div class="top"><span class="strong">+${fmt(l.demos)} DEMOS</span><span class="badge ${ok?'suc':'mut'}">${ok?'можно вывести':`через ${left} ${dayWord(left)}`}</span></div>
    <div class="caption c-mut">${esc(l.title)} · ${cur(l.ton)}</div>
    <div class="top caption" style="margin-top:6px"><span class="c-sec">Лежит ${d} ${dayWord(d)}${ok?'':` из ${LOCK_DAYS}`}</span><span>на кошелёк <b>${fmt(out)}</b></span></div>
    <div class="prog" style="height:4px"><i style="width:${pct}%"></i></div>
    <div class="caption c-mut">${ok?`Можно вывести · комиссия ${FEE}%`:`Вывод через ${left} ${dayWord(left)} · комиссия ${FEE}%`}</div>
    <div class="top caption" style="margin-top:4px;border-top:1px solid var(--b-default);padding-top:8px"><span class="c-sec">${l.tip?`Автору @${esc(l.author||'')}: ${l.tip}% · ${fmt(lotTip(l))} DEMOS`:'Награда автору не выбрана'}</span><button class="c-acc" style="font-weight:600" data-a="tip-edit" data-i="${S.lots.indexOf(l)}">Изменить</button></div></div>`; }

const setText = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
function distKm(a, b){ const R = 6371, r = x => x*Math.PI/180; const dLat = r(b.lat-a.lat), dLon = r(b.lon-a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const fmtKm = km => km < 1 ? `${Math.round(km*1000)} м` : `${km.toFixed(1).replace('.',',')} км`;
function mapSub(P, create){
  if (P.src==='gps') return 'По GPS' + (P.acc ? ` · точность ±${Math.round(P.acc)} м` : '');
  if (create && S.me) return `Указано вручную · ${fmtKm(distKm(S.me, P))} от вас`;
  if (P.src==='manual') return 'Указано вручную';
  return 'Передвиньте карту, чтобы поставить точку';
}
// Геопозиция: в Telegram — через LocationManager (Bot API 8.0+), в браузере — navigator.geolocation
function locate(cb){
  let fin = false; const done = (r, why) => { if (fin) return; fin = true; if (r) S.me = r; cb(r, why); };
  setTimeout(() => done(null, 'timeout'), 15000);
  try{
    if (tg && tg.LocationManager && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')){
      const LM = tg.LocationManager;
      const ask = () => {
        if (!LM.isLocationAvailable) return done(null, 'unavailable');
        if (LM.isAccessRequested && !LM.isAccessGranted) return done(null, 'denied');
        LM.getLocation(l => l ? done({lat:l.latitude, lon:l.longitude, acc:l.horizontal_accuracy||0}) : done(null, (LM.isAccessRequested && !LM.isAccessGranted) ? 'denied' : 'unavailable'));
      };
      LM.isInited ? ask() : LM.init(ask); return;
    }
    if (navigator.geolocation){ navigator.geolocation.getCurrentPosition(
      p => done({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy||0}),
      e => done(null, e && e.code===1 ? 'denied' : 'unavailable'), {enableHighAccuracy:true, timeout:12000, maximumAge:60000}); return; }
  }catch(e){}
  done(null, 'unavailable');
}
function locateError(why){
  if (why==='denied') toast('Нет доступа к геолокации. Разрешите её для бота в настройках Telegram — или передвиньте карту вручную.' + (tg && tg.LocationManager ? ' <button class="c-acc" data-a="geo-settings" style="font-weight:600">Открыть настройки</button>' : ''));
  else toast('Не удалось определить местоположение. Передвиньте карту, чтобы поставить точку вручную.');
}
let geoT = 0, geoN = 0;
function reverseGeocode(lat, lon, cb){
  clearTimeout(geoT); const n = ++geoN; const coords = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  geoT = setTimeout(() => {
    fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=ru`)
      .then(r => r.json()).then(j => { if (n !== geoN) return; const a = j.address || {};
        const city = a.city || a.town || a.village || a.municipality || a.state || '';
        const street = [a.road || a.pedestrian || a.square || a.neighbourhood || a.suburb || a.quarter, a.house_number].filter(Boolean).join(', ');
        cb([city, street].filter(Boolean).join(', ') || coords); })
      .catch(() => { if (n === geoN) cb(coords); });
  }, 500);
}
let LMAP = null, LANCHOR = [];
function killMap(){ if (LMAP){ try{ LMAP.remove(); }catch(e){} LMAP = null; LANCHOR = []; } }
const anchorPoint = () => S.me || S.geo;
const overLimit = () => S.params.mode==='create' && distKm(anchorPoint(), S.mapPoint) > 10;
function checkLimit(){
  const over = overLimit(); const w = document.getElementById('map-warn'); if (w) w.classList.toggle('hidden', !over);
  const b = document.getElementById('map-ok'); if (b) b.disabled = over;
}
function drawAnchor(){
  LANCHOR.forEach(l => { try{ LMAP.removeLayer(l); }catch(e){} }); LANCHOR = [];
  if (!LMAP || S.params.mode!=='create') return; const a = anchorPoint();
  LANCHOR.push(L.circle([a.lat, a.lon], {radius:10000, color:'#0166FF', weight:2, dashArray:'6 6', fillColor:'#0166FF', fillOpacity:.06, interactive:false}).addTo(LMAP));
  if (S.me) LANCHOR.push(L.circleMarker([S.me.lat, S.me.lon], {radius:6, color:'#fff', weight:2, fillColor:'#9AA3B8', fillOpacity:1, interactive:false}).addTo(LMAP));
}
function initMap(){
  killMap(); const box = document.getElementById('mapbox'); if (!box || !window.L) return;
  const P = S.mapPoint; box.classList.add('live');
  S.mapProg = true;
  LMAP = L.map(box, {zoomControl:false, attributionControl:false}).setView([P.lat, P.lon], 16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(LMAP);
  drawAnchor(); checkLimit();
  if (!P.label) reverseGeocode(P.lat, P.lon, lbl => { S.mapPoint.label = lbl; setText('map-label', lbl); });
  LMAP.on('movestart', () => { if (!S.mapProg) setText('map-label', 'Определяем адрес…'); });
  LMAP.on('moveend', () => {
    const c = LMAP.getCenter(); const prog = S.mapProg; S.mapProg = false;
    if (prog) return;
    S.mapPoint = {lat:c.lat, lon:c.lng, acc:0, src:'manual', label:'Определяем адрес…'};
    setText('map-sub', mapSub(S.mapPoint, S.params.mode==='create')); checkLimit();
    reverseGeocode(c.lat, c.lng, lbl => { S.mapPoint.label = lbl; setText('map-label', lbl); });
  });
}

// ---------- свайп вниз закрывает окно ----------
function enableSwipeDown(sheet, dim){
  let y0 = null, dy = 0, t0 = 0, dragging = false;
  const sc = sheet.querySelector('.sc');
  sheet.addEventListener('touchstart', e => {
    const inGrab = e.target.closest('.grab');
    const atTop = !sc || sc.scrollTop <= 0 || !sc.contains(e.target);
    if (e.target.closest('input,textarea')) return;
    if (inGrab || atTop){ y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); dragging = false; sheet.style.transition = 'none'; }
  }, {passive:true});
  sheet.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0){ if (dragging){ sheet.style.transform = ''; } return; }
    if (!dragging && dy < 10) return; // небольшое движение пальца при нажатии — это тап, а не свайп (iOS)
    if (!dragging && sc && sc.scrollTop > 0 && sc.contains(e.target)) { y0 = null; return; }
    dragging = true; e.preventDefault();
    sheet.style.transform = `translateY(${dy}px)`; dim.style.opacity = String(Math.max(0, 1 - dy/400));
  }, {passive:false});
  sheet.addEventListener('touchend', () => {
    if (y0 === null) return; const v = dy / Math.max(1, Date.now()-t0); y0 = null;
    sheet.style.transition = 'transform .2s ease-out'; dim.style.transition = 'opacity .2s';
    if (dragging && (dy > 110 || v > 0.6)){ sheet.style.transform = 'translateY(100%)'; dim.style.opacity = '0'; setTimeout(closeSheet, 190); }
    else { sheet.style.transform = ''; dim.style.opacity = ''; }
    dragging = false;
  });
}

// Копия файла в памяти приложения. На Android доступ к файлу из галереи временный:
// когда выбираешь следующий файл, ссылка на предыдущий может перестать работать — и картинка становится чёрной.
async function ownURL(file){ try{ const buf = await file.arrayBuffer(); return URL.createObjectURL(new Blob([buf], {type: file.type || 'application/octet-stream'})); }catch(e){ return URL.createObjectURL(file); } }
function videoMeta(url){ return new Promise(res => { const v = document.createElement('video'); v.preload='metadata'; v.muted = true; v.src = url;
  v.onloadedmetadata = () => res(v.duration); v.onerror = () => res(null); setTimeout(()=>res(-1), 8000); }); }
const durStr = d => `${Math.floor(d/60)}:${String(Math.round(d%60)).padStart(2,'0')}`;
async function handleMedia(k, files){
  if (!files.length) return;
  const keepText = () => { const ta = document.querySelector('[data-input="addtext"]'); if (ta) S.params.addText = ta.value; };
  const f = files[0];
  if (f.type.startsWith('video')){
    const url = await ownURL(f); const d = await videoMeta(url);
    if (d === null) return toast('Не удалось открыть видео — попробуйте другой файл');
    if (d > 180) return toast('Видео длиннее 3 минут — обрежьте или выберите другое');
    const m = {url, kind:'video', dur: d > 0 ? durStr(d) : ''};
    if (k==='media') S.draft.media = [m]; else { keepText(); S.params.addMedia = m; }
  } else {
    if (k==='media') S.draft.media = await Promise.all(files.slice(0,10).map(async x => ({url: await ownURL(x), kind:'photo'})));
    else { keepText(); S.params.addMedia = {url: await ownURL(f), kind:'photo'}; }
  }
  render(false);
}

function currentCard(){

try{ const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param; if (sp && !store.get('invitedBy', null)) store.set('invitedBy', {code: String(sp).replace(/^ref_/,''), at: new Date().toISOString()}); }catch(e){}

function keepRefInUrl(){ try{ const c = inviteCode(); if (WEB && c && new URLSearchParams(location.search).get('ref')!==c) history.replaceState(null, '', location.pathname + '?ref=' + encodeURIComponent(c)); }catch(e){} }
if (WEB){ try{ const q = new URLSearchParams(location.search).get('ref'); if (q && /^[A-Za-z0-9_.]{3,32}$/.test(q.replace(/^ref_/,'')) && !store.get('invitedBy', null)) store.set('invitedBy', {code:q.replace(/^ref_/,''), at:new Date().toISOString()}); }catch(e){} keepRefInUrl(); }

render(true);
if (!S.onboarded && S.screen==='splash') setTimeout(()=>{ if (S.screen==='splash') go(WEB ? 'invited' : 'ob1', {}, false); }, 1800);
