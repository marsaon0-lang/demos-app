plugins {
    id 'com.android.application'
}

android {
    namespace 'com.demos.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.demos.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '0.39-test'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
